[package]
name = "adapter-registry"
version = "1.0.0"
description = "Governance-gated on-chain registry for Solana Yield Adapter Standard (Quasar)"
edition = "2021"
license = "Apache-2.0"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
]

[lib]
crate-type = ["cdylib", "lib"]
name = "adapter_registry"

[features]
alloc = []
client = []
debug = []
idl-build = ["quasar-lang/idl-build", "yield-adapter-trait/idl-build"]

[dependencies]
quasar-lang = { workspace = true }
yield-adapter-trait = { path = "../../crates/yield-adapter-trait" }

[dev-dependencies]
quasar-svm = { git = "https://github.com/blueshift-gg/quasar-svm" }
solana-address = { version = "=2.2.0", features = ["curve25519", "wincode"] }
solana-instruction = "3"
wincode = { version = "=0.4.9", features = ["derive"] }
